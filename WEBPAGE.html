<!DOCTYPE html>
<html>
<head>
    <title>Block vs Inline Elements</title>
</head>
<body>

    <h2>Block Elements (div)</h2>

    <div style="background-color: lightblue;">Div 1</div>
    <div style="background-color: lightblue;">Div 2</div>
    <div style="background-color: lightblue;">Div 3</div>

    <h2>Inline Elements (span)</h2>

    <span style="background-color: lightgreen;">Span 1</span>
    <span style="background-color: lightgreen;">Span 2</span>
    <span style="background-color: lightgreen;">Span 3</span>

    <h2>Observation</h2>

    <p>1. Div elements start on a new line.</p>
    <p>2. Div elements take full width.</p>
    <p>3. Span elements stay on the same line.</p>
    <p>4. Span elements take only the required width.</p>

</body>
</html>
